# MintEval v0 base configuration. Every tunable lives here.
seed: 20260101
data:
  symbol: BTCUSDT
  interval_minutes: 15
  start: "2022-01-01"
  end: "2024-01-01"          # exclusive
  raw_dir: data/prices/raw
  price_file: data/prices/BTCUSDT_15m_2022_2023.csv
engine:
  initial_equity: 10000.0
  fee_bp: 5.0                 # taker fee per fill, basis points of notional
  slippage_bp: 1.0            # adverse price slippage per fill
  quant_delta: 0.05           # target-position grid (calibrated in step 5, see PROGRESS.md)
  bars_per_year: 35040
  warmup_bars: 960            # 10 days; strategy first called at the close of bar 960
sandbox:
  timeout_s: 10
  memory_mb: 2048
  allowed_imports: [math, numpy]
pool:
  n_candidates: 15000         # spec said 3000; 15000 needed so every (tau bin x R band) cell can be filled
  min_trades: 20
  bust_frac_bars: 0.05        # "no blow-up in the first 5% of bars": equity >= 50% of initial
  bust_equity_frac: 0.5
  n_bins: 5
  per_bin: 160
  bin_on: tau_max
  r_match:                    # match the R_bench distribution across tau bins (common support)
    lo: -0.85
    hi: 0.15
    n_bands: 5
sampler:
  risk_size_p: [0.25, 0.35, 0.40]   # P(1, 2, 3 risk layers): skewed hard on purpose
  filter_p: 0.35
translate:
  model: {kind: openrouter, model: google/gemini-3.5-flash-lite}
  min_words: 40
  max_words: 120
  max_attempts: 6
  temperature: 0.7
  roundtrip: {enabled: true,   # fidelity gate; see PROGRESS.md step 4
              model: {kind: openrouter, model: deepseek/deepseek-v4-pro, extra: {reasoning: {effort: low}}}}
models:                       # subjects under test; temperature 0, one sample per task
  - {name: gpt-5.4-mini, kind: openrouter, model: openai/gpt-5.4-mini}
  - {name: claude-haiku, kind: openrouter, model: "~anthropic/claude-haiku-latest"}
  - {name: claude-opus-5.5, kind: openrouter, model: anthropic/claude-opus-5.5}   # frontier reference, subset only
  - {name: gpt-5.5, kind: openrouter, model: openai/gpt-5.5}                     # non-Anthropic frontier (blocked: provider 403)
  - {name: qwen3.8-max, kind: openrouter, model: qwen/qwen3.8-max-0902, extra: {reasoning: {effort: low}}}   # default effort hit 32k tokens / 1000 s
  - {name: deepseek-v4-pro, kind: openrouter, model: deepseek/deepseek-v4-pro, extra: {reasoning: {effort: high}}}  # also the round-trip reader (bias caveat)
  - {name: qwen2.5-coder-7b, kind: vllm, base_url: "http://127.0.0.1:18007/v1", model: qwen2.5-coder-7b, max_tokens: 8192}
  - {name: qwen2.5-coder-32b, kind: vllm, base_url: "http://127.0.0.1:18032/v1", model: qwen2.5-coder-32b, max_tokens: 8192}
generation:
  temperature: 0.0
  max_tokens: 32768           # 8000 truncated reasoning models in the smoke test (PROGRESS step 4)
  settings: [open, closed]
  workers: {openrouter: 64, vllm: 64}       # 24 caused HTTP 402 (in-flight credit check) near the budget end
